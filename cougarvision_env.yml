name: cougarvision_env
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - setuptools
  - wheel
  - numpy>=2.0.2
  - pandas>=2.2.2
  - scikit-learn>=1.5.2
  - pillow>=11.0.0
  - tqdm>=4.66.5
  - dill>=0.4.0
  - openssl
  - sqlite
  - zlib
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch>=2.6.0
      - torchvision>=0.21.0
      - onnxruntime-gpu>=1.23.2
      - opencv-python>=4.12.0.88
      - timm>=1.0.9
      - ultralytics>=8.3.95
      - wget>=3.2
      - schedule>=1.2.2
      - sageranger>=1.0.3
